name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os-label }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, os-label: Windows, python-version: "3.11"}
          - {os: windows-latest, os-label: Windows, python-version: "3.14"}
          - {os: ubuntu-24.04, os-label: Ubuntu, python-version: "3.12"}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install approval verification dependency
        run: python -m pip install -r requirements-approval.txt

      - name: Compile
        run: python -B -m compileall -q src scripts tests

      - name: Unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Git whitespace check
        run: git diff --check
